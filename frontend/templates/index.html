<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntelliBot Streaming</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="chat-container">
        <div id="chat-box">
             <div class="message bot">
                <div class="message-wrapper">
                    <button class="copy-btn" onclick="copyText(this)">Copy</button>
                    <span>Hello! I am ready to answer questions from your documents.</span>
                </div>
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Ask about your documents..." autocomplete="off">
            <button type="button" onclick="send()">Send</button>
        </div>
    </div>

    <script>
        document.getElementById("user-input").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                send();
            }
        });

        // --- ROBUST COPY FUNCTION ---
        function copyText(btnElement) {
            // Find the text span (sibling of the button)
            const wrapper = btnElement.parentElement;
            const textSpan = wrapper.querySelector('span');
            
            // cleanup: get text without HTML tags (like sources) if needed
            const textToCopy = textSpan.innerText; 

            // Try modern API first, fall back to legacy if it fails
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(textToCopy).then(() => showCopied(btnElement));
            } else {
                // Fallback for non-secure contexts (Localhost sometimes needs this)
                const textArea = document.createElement("textarea");
                textArea.value = textToCopy;
                textArea.style.position = "fixed"; // Avoid scrolling to bottom
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                    showCopied(btnElement);
                } catch (err) {
                    console.error('Fallback copy failed', err);
                    btnElement.innerText = 'Error';
                }
                document.body.removeChild(textArea);
            }
        }

        function showCopied(btn) {
            const originalText = btn.innerText;
            btn.innerText = '✅ Copied!';
            btn.style.borderColor = '#10b981';
            btn.style.color = '#10b981';
            setTimeout(() => { 
                btn.innerText = 'Copy'; 
                btn.style.borderColor = '#cbd5e1';
                btn.style.color = '#64748b';
            }, 2000);
        }

        async function send() {
            const input = document.getElementById('user-input');
            const query = input.value.trim();
            if(!query) return;

            addMessage('user', query);
            input.value = '';

            const botDiv = addMessage('bot', '<span class="thinking">Thinking...</span>');
            const botContent = botDiv.querySelector('.message-wrapper span'); 

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({query: query})
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullText = "";
                let sourcesHtml = "";
                let isFirstChunk = true;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const lines = decoder.decode(value, {stream: true}).split('\n');
                    for (const line of lines) {
                        if (!line.trim()) continue;
                        try {
                            const data = JSON.parse(line);
                            if (data.type === 'token') {
                                if (isFirstChunk) { botContent.innerHTML = ''; isFirstChunk = false; }
                                fullText += data.content;
                                botContent.innerHTML = fullText + '<span class="cursor">|</span>';
                            } else if (data.type === 'sources' && data.content.length > 0) {
                                sourcesHtml = "<br><br><div class='sources-container'>📚 <b>Sources:</b> " + 
                                    data.content.map(s => `<span class='source-tag'>${s.file} (p. ${s.page})</span>`).join('') + "</div>";
                            }
                        } catch (e) { console.error(e); }
                    }
                }
                botContent.innerHTML = fullText + sourcesHtml;
            } catch (e) { botContent.innerHTML = "⚠️ Error connecting."; }
        }

        function addMessage(role, htmlContent) {
            const box = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = `message ${role}`;
            
            if (role === 'bot') {
                const wrapper = document.createElement('div');
                wrapper.className = 'message-wrapper';
                
                // Add button FIRST
                const btn = document.createElement('button');
                btn.className = 'copy-btn';
                btn.innerText = 'Copy';
                btn.onclick = function() { copyText(this); }; // Bind click
                
                const span = document.createElement('span');
                span.innerHTML = htmlContent;

                wrapper.appendChild(btn);
                wrapper.appendChild(span);
                div.appendChild(wrapper);
            } else {
                div.innerHTML = htmlContent;
            }
            box.appendChild(div);
            box.scrollTo({ top: box.scrollHeight, behavior: 'smooth' });
            return div;
        }
    </script>
</body>
</html>
